<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>تمكين الإدارة</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:system-ui,sans-serif;background:#101725;color:#e8ecf3}
  .box{max-width:340px;margin:24px;padding:28px 22px;background:#182133;border:1px solid #2a3550;border-radius:16px;box-shadow:0 4px 20px rgba(0,0,0,.35);text-align:center}
  .logo{font-weight:900;font-size:28px;letter-spacing:1px;color:#e8ecf3}
  .logo span{color:#f5a623}
  .tag{font-size:13px;font-weight:700;color:#f5a623;margin-top:4px}
  h1{font-size:18px;margin:18px 0 8px;color:#f2f5fa}
  p{font-size:14px;line-height:1.8;color:#a9b4c6;margin:0 0 20px}
  button{background:#f5a623;color:#101725;border:0;border-radius:10px;padding:12px 22px;font-size:15px;font-weight:700;width:100%}
</style>
</head>
<body>
  <div class="box">
    <div class="logo"><span>T</span>AMKEN</div>
    <div class="tag">تمكين لحلول الطاقة</div>
    <h1>لا يوجد اتصال بالإنترنت</h1>
    <p>افتح التطبيق مرة واحدة والإنترنت متصل حتى تُحفظ اللوحة وبياناتها في الجوال، وبعدها تفتح بدون نت.</p>
    <button onclick="TamkenAndroid.retry()">إعادة المحاولة</button>
  </div>
</body>
</html>

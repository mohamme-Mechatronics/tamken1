<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>تمكين الإدارة</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:system-ui,sans-serif;background:#f6f7f6;color:#1f2937}
  .box{max-width:340px;margin:24px;padding:28px 22px;background:#fff;border-radius:16px;box-shadow:0 4px 20px rgba(0,0,0,.08);text-align:center}
  .logo{font-weight:900;font-size:28px;letter-spacing:1px}
  .logo span{color:#dc2626}
  h1{font-size:18px;margin:18px 0 8px}
  p{font-size:14px;line-height:1.8;color:#4b5563;margin:0 0 20px}
  button{background:#15803d;color:#fff;border:0;border-radius:10px;padding:12px 22px;font-size:15px;font-weight:700;width:100%}
</style>
</head>
<body>
  <div class="box">
    <div class="logo"><span>T</span>AMKEN</div>
    <h1>لا يوجد اتصال بالإنترنت</h1>
    <p>افتح التطبيق مرة واحدة والإنترنت متصل حتى تُحفظ اللوحة وبياناتها في الجوال، وبعدها تفتح بدون نت.</p>
    <button onclick="TamkenAndroid.retry()">إعادة المحاولة</button>
  </div>
</body>
</html>
